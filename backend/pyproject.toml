[project]
name = "agencia-automatizada-backend"
version = "0.0.0"
description = "Agencia Automatizada MVP-0 backend (Phase 1 foundation)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "psycopg[binary]>=3",
    "pydantic",
    "sqlalchemy>=2,<3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
# tests/integration needs a real PostgreSQL (TEST_DATABASE_URL) and is run explicitly:
#   pytest tests/integration
testpaths = ["tests/unit", "tests/test_smoke.py"]
pythonpath = ["."]
