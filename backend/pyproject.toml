[project]
name = "agencia-automatizada-backend"
version = "0.0.0"
description = "Agencia Automatizada MVP-0 backend (Phase 1 foundation)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
